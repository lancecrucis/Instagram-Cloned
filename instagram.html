<!DOCTYPE html>
<html>
    <head>
        <title>Instagram</title>

        <style>
            body{
                font-family: Arial, sans-serif;
                background-color: black;
            }
            .lance{
                display: flex;
                gap: 30px;
                flex-wrap: wrap;
            }
            .lance-pfp{
                width: 100px;
                height: 100px;
                border-radius: 50px ;
                
            }
            .lance-name{
                margin-left: 20px;
                font-family: Arial, sans-serif;
                font-size: 18px;
                display: inline-block;
                color: white;
            }
            .btn{
                background-color: rgb(54, 54, 54);
                color: white;
                border: none;
                border-radius: 5px;
                padding: 8px 12px;
                margin-left:5px ;
            }
            .grid{
                display: grid;
                grid-template-columns: auto auto auto;
                gap: 10px;
            }
            .numbers{
                margin-top: 15px;
            }
            .link{
                background-color: rgb(54, 54, 54);
                border-bottom-color: rgba(0, 0, 0, 0.4);
                border: none;
                margin-top: 10px;
                border-radius: 50px;
                color: white;
                padding: 7px;
                font-family: arial;
            }
            .grid2{
               
                margin-left: 20px;
                margin-right: 20px;
                margin-top: 18px;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
                gap: 30px;
            }
            .myday{
                border-radius: 50px;
                width: 70px;
                height: 70px;
                border: 5px;
                border-width: 10px;
                border-color: gray
            }
            .myday1{
                border-radius: 50px;
                width: 70px;
                height: 70px;
                border: 5px;
                border-width: 10px;
                border-color: gray;
                object-fit: cover;
            }
            .highlights{
                font-size: 13px;
                color: white;
                padding: 0;
                margin-left: 5px;
                
            }
            .highlights1{
                font-size: 13px;
                color: white;
                padding: 0;
                margin-left: 22px;
                font-family: arial;
                
            }
            .center{
                margin-left: 30%;
                margin-right: 20%;
                margin-top: 20px;
            }
            .grid3{
               
               margin-left: 20px;
               margin-right: 20px;
               margin-top: 18px;
               display: grid;
               grid-template-columns: 1fr 1fr 1fr;
               margin-left: 30%;
               margin-right: 40%;
               gap: 20px;
           }
           .grid4{
               margin-top: 18px;
               display: grid;
               grid-template-columns: 1fr 1fr 1fr;
               gap: 8px;
               margin-right: 20px;
               
           }
           .pic{
            height: 233px;
            width: 233px;
            object-fit: cover;
            
           }

        </style>
    </head>
